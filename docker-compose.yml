version: '3.8'

services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.17.0
    container_name: porvenir_mlflow_server
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlruns
      - ./mlflow.db:/mlflow.db
    command: >
      mlflow server
      --backend-store-uri sqlite:///mlflow.db
      --default-artifact-root /mlruns
      --host 0.0.0.0
      --port 5000

  api:
    build: .
    container_name: porvenir_risk_api
    depends_on:
      - mlflow
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    ports:
      - "8000:8000"
    volumes:
      - ./mlruns:/workspace/mlruns
      - ./mlflow.db:/workspace/mlflow.db